<!DOCTYPE html>
<!--
  Страница игры (шаблон WebGL "PROJECT:Game", его ставит BuildScript).
  Canvas всегда на всё окно: на телефоне портрет, на ПК и в iframe 16:9
  камера показывает больше поля по бокам (CLAUDE.md, инварианты). Своей
  кнопки fullscreen, подвала и логотипов нет, Esc не перехватывается.
  Названий площадок и внешних ссылок на странице нет; в билде под
  площадку BuildScript подставляет её скрипты на место platform-head
  (tools/platform/), и движок стартует после window.game7PlatformReady,
  если скрипт его создал (файлы билда качаются сразу, не дожидаясь). Заголовок вкладки — название игры из game.json в
  корне репозитория: BuildScript подставляет его на место game-title.
  На место metrica-head BuildScript ставит счётчик Яндекс Метрики
  (tools/platform/metrica_head.html), если он включён для цели сборки;
  ход загрузки уходит в него целями load_* (docs/ANALYTICS.md).
  Экран загрузки (аудит CrazyGames 20.10, ZL-18: «чёрный экран с
  оранжевой полоской — как будто сломалось»): кадр игры loading.jpg
  (113 КБ), название из game.json шрифтом интерфейса (Russo One целиком,
  loading.woff2, лицензия — loading-font-OFL.txt) и полоса в стиле кнопок
  игры; виден с первого кадра страницы, тает, когда игра запустилась.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>&#1047;&#1086;&#1084;&#1073;&#1080; &#1051;&#1077;&#1085;&#1076;</title>
    <script>
      // Звук страницы спит, пока её не видно. Все AudioContext (звук Unity и
      // музыка) записываются при создании; спрятали страницу — suspend,
      // показали — resume. Причины прятать независимы: вкладка
      // (visibilitychange, pagehide) и площадка (ВК сворачивает мини-
      // приложение событием VKWebAppViewHide, а вкладка остаётся «видна» —
      // так музыка играла поверх приложения ВК). Площадка зовёт
      // game7PageAudio.hide(причина) и show(причина).
      (function () {
        var Base = window.AudioContext || window.webkitAudioContext;
        var contexts = [];
        var reasons = {};
        function hidden() {
          for (var key in reasons) if (reasons[key]) return true;
          return false;
        }
        function apply() {
          var sleep = hidden();
          contexts.forEach(function (ctx) {
            try {
              if (sleep && ctx.state === "running") ctx.suspend();
              else if (!sleep && ctx.state === "suspended") ctx.resume();
            } catch (e) {}
          });
        }
        // Мягкий лимитер на выходе (аудит CrazyGames 20.10, ZL-12): в
        // насыщенном бою сумма звуков Unity уходила за 0 dBFS и трещала, а
        // эффекты AudioMixer в WebGL не работают. Unity подключает весь звук
        // к context.destination — здесь это вход цепочки «компрессор → trim →
        // выход»: выше −4 dBFS (мягкое колено 4 дБ) сжатие 20:1, потолок около
        // −2 dBFS. Компрессор сам поднимает всё на 1.58 дБ (makeup, замер в
        // Chromium) — trim его снимает: ниже порога громкость прежняя.
        var LIMITER = { threshold: -4, knee: 4, ratio: 20, attack: 0.002, release: 0.2, trim: 0.834 };
        function findDescriptor(proto, name) {
          for (; proto; proto = Object.getPrototypeOf(proto)) {
            var d = Object.getOwnPropertyDescriptor(proto, name);
            if (d) return d;
          }
          return null;
        }
        var realDestination = Base ? findDescriptor(Base.prototype, "destination") : null;
        if (Base) {
          var Watched = class extends Base {
            constructor(options) {
              super(options);
              contexts.push(this);
              if (hidden()) this.suspend();
              try {
                var limiter = this.createDynamicsCompressor();
                limiter.threshold.value = LIMITER.threshold;
                limiter.knee.value = LIMITER.knee;
                limiter.ratio.value = LIMITER.ratio;
                limiter.attack.value = LIMITER.attack;
                limiter.release.value = LIMITER.release;
                var trim = this.createGain();
                trim.gain.value = LIMITER.trim;
                limiter.connect(trim);
                trim.connect(realDestination.get.call(this));
                this.game7Limiter = limiter;
              } catch (e) {}
            }
            get destination() {
              return this.game7Limiter || realDestination.get.call(this);
            }
          };
          window.AudioContext = Watched;
          if (window.webkitAudioContext) window.webkitAudioContext = Watched;
        }
        function set(reason, on) {
          reasons[reason] = on;
          apply();
        }
        window.game7PageAudio = {
          hide: function (reason) { set(reason, true); },
          show: function (reason) { set(reason, false); },
        };
        document.addEventListener("visibilitychange", function () {
          set("page", document.visibilityState === "hidden");
        });
        window.addEventListener("pagehide", function () { set("page", true); });
        window.addEventListener("pageshow", function () { set("page", document.visibilityState === "hidden"); });
      })();
    </script>
    <script>
  // Яндекс Метрика (docs/ANALYTICS.md, «Яндекс Метрика»): BuildScript
  // ставит этот кусок на место metrica-head. Счётчик поднимается до
  // загрузки Unity, и шаблон отмечает целями ход загрузки (load_start,
  // load_50, load_done, load_error): видно, сколько людей ушло, не
  // дождавшись игры. Номер счётчика — из analytics.json (metrica) только
  // в релизной цели площадки; в dev-билде счётчика нет, пока в адресе нет
  // ?ym=<номер>.
  // Просмотр страницы (hit) — вручную (defer: true), по адресу без
  // параметров: в адресе игры ВК — параметры запуска с номером игрока, им
  // в Метрике не место; источник перехода — только сайт. Заказы
  // электронной коммерции счётчик читает из window.dataLayer.
  (function () {
    var id = 0;
    if (true) {
      var q = /[?&]ym=(\d+)/.exec(location.search);
      if (q) id = +q[1];
    }
    window.game7YmGoal = function (name, params) {
      if (window.game7Ym) window.ym(window.game7Ym, "reachGoal", name, params);
    };
    if (!id) return;
    window.dataLayer = window.dataLayer || [];
    (function (m, e, t, r, i, k, a) {
      m[i] = m[i] || function () { (m[i].a = m[i].a || []).push(arguments); };
      m[i].l = 1 * new Date();
      for (var j = 0; j < document.scripts.length; j++) {
        if (document.scripts[j].src === r) return;
      }
      k = e.createElement(t); a = e.getElementsByTagName(t)[0];
      k.async = 1; k.src = r; a.parentNode.insertBefore(k, a);
    })(window, document, "script", "https://mc.yandex.ru/metrika/tag.js", "ym");
    window.ym(id, "init", {
      defer: true, clickmap: false, trackLinks: false, accurateTrackBounce: true, webvisor: false,
      ecommerce: "dataLayer"
    });
    var referer = "";
    try { if (document.referrer) referer = new URL(document.referrer).origin + "/"; } catch (e) {}
    window.ym(id, "hit", location.origin + location.pathname, { title: document.title, referer: referer });
    window.game7Ym = id;
  })();
</script>
    <!-- platform-head -->
    <link rel="preload" href="loading.jpg" as="image">
    <style>
      @font-face {
        font-family: "Game7Title";
        src: url("loading.woff2") format("woff2");
        font-display: swap;
      }
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1b1420;
        overscroll-behavior: none;
      }
      #unity-canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        background: #1b1420;
        outline: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game7-loading {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5vmin;
        background: #1b1420 url("loading.jpg") center / cover no-repeat;
        transition: opacity 0.35s;
      }
      #game7-loading::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(27, 20, 32, 0.35) 0%, rgba(27, 20, 32, 0.8) 100%);
      }
      #game7-loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #game7-loading-title {
        position: relative;
        padding: 0 16px;
        font-family: "Game7Title", "Arial Black", Impact, sans-serif;
        font-size: clamp(34px, 10vmin, 92px);
        line-height: 1.1;
        text-align: center;
        color: #ffd23d;
        -webkit-text-stroke: 2px #3a1608;
        text-shadow: 0 5px 0 #7a2a10, 0 0 24px rgba(0, 0, 0, 0.7);
      }
      #unity-loading-bar {
        position: relative;
        width: min(64vw, 380px);
        height: 18px;
        box-sizing: border-box;
        border: 3px solid #ffffff;
        border-radius: 10px;
        background: rgba(20, 12, 24, 0.8);
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.45);
        overflow: hidden;
      }
      #unity-progress-bar-full {
        width: 0%;
        height: 100%;
        border-radius: 6px;
        background: linear-gradient(#ffe066, #ffae1a);
        transition: width 0.2s;
      }
      #unity-warning {
        position: fixed;
        left: 50%;
        top: 12px;
        transform: translateX(-50%);
        max-width: 90vw;
        font: 14px sans-serif;
        color: #fff;
        display: none;
        z-index: 3;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="game7-loading">
      <div id="game7-loading-title">&#1047;&#1086;&#1084;&#1073;&#1080; &#1051;&#1077;&#1085;&#1076;</div>
      <div id="unity-loading-bar"><div id="unity-progress-bar-full"></div></div>
    </div>
    <div id="unity-warning"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var warning = document.querySelector("#unity-warning");

      // Ход загрузки в Яндекс Метрику (без счётчика — ничего).
      var loadStart = Date.now();
      function ymGoal(name, params) {
        if (window.game7YmGoal) window.game7YmGoal(name, params);
      }
      ymGoal("load_start");
      var loadHalf = false;

      // С showBanner загрузчик Unity шлёт свои ошибки только сюда, мимо
      // консоли: без console.error smoke-тест не увидел бы, что игра не
      // запустилась.
      function unityShowBanner(msg, type) {
        if (type == "error") console.error(msg);
        var div = document.createElement("div");
        div.textContent = msg;
        div.style.padding = "8px 12px";
        div.style.borderRadius = "6px";
        div.style.background = type == "error" ? "#b3261e" : "#6b5a1e";
        warning.appendChild(div);
        warning.style.display = "block";
        if (type != "error") {
          setTimeout(function () {
            warning.removeChild(div);
            warning.style.display = warning.children.length ? "block" : "none";
          }, 5000);
        }
      }

      // Долгое нажатие на телефоне не открывает меню браузера поверх игры.
      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

      // Текстуры: основной data — в DXT (ПК), второй — в ASTC для телефонов
      // (BuildScript ставит его имя на место маркера; null — второго нет).
      // DXT видеокарты Adreno и Mali не понимают: Unity распаковал бы все
      // текстуры на CPU при загрузке. ASTC берём, только если DXT нет, а
      // ASTC есть: ПК с обоими форматами остаётся на основном. ?tex=astc
      // или ?tex=dxt в адресе — выбрать файл вручную (проверки).
      var dataFile = "dev-20261020-200139.data.unityweb";
      var astcDataFile = "dev-20261020-200139.astc.data.unityweb";
      var texFormat = "dxt";
      if (astcDataFile) {
        var texForce = /[?&]tex=(astc|dxt)(&|$)/.exec(location.search);
        if (texForce) {
          texFormat = texForce[1];
        } else {
          try {
            var probe = document.createElement("canvas");
            var gl = probe.getContext("webgl2") || probe.getContext("webgl");
            if (gl) {
              if (!gl.getExtension("WEBGL_compressed_texture_s3tc") && gl.getExtension("WEBGL_compressed_texture_astc")) {
                texFormat = "astc";
              }
              var lose = gl.getExtension("WEBGL_lose_context");
              if (lose) lose.loseContext();
            }
          } catch (e) {}
        }
        if (texFormat == "astc") dataFile = astcDataFile;
      }
      window.game7TexFormat = texFormat;

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/dev-20261020-200139.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/" + dataFile,
        frameworkUrl: buildUrl + "/dev-20261020-200139.framework.js.unityweb",
        codeUrl: buildUrl + "/dev-20261020-200139.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Vanatat",
        productName: "Zomboland",
        productVersion: "dev-20261020-200139",
        showBanner: unityShowBanner,
        // Экраны с плотностью 3 рисовали бы в 9 раз больше пикселей, чем
        // с плотностью 1: потолок 2 держит 60 FPS на среднем телефоне.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        // Имена файлов Build/ уникальны для каждой сборки (штамп в имени,
        // tools/unity_build_webgl.sh), поэтому data, wasm и framework берутся
        // из кэша Unity (Cache Storage) без условного запроса к серверу. По
        // умолчанию loader перепроверяет data (304) и не кэширует wasm и
        // framework вовсе: повторный заход качал 12.6 МБ wasm заново, если
        // WebView вытеснил его из HTTP-кэша. Записи прошлых сборок loader
        // стирает сам (другая productVersion = имя билда).
        // Только эти три файла: через ту же функцию идёт каждый GET
        // UnityWebRequest (framework: Module.cacheControl(url)). "immutable"
        // для всех отдал бы из кэша старый ответ /v1/purchases?after=N
        // (купленные монеты не выдаются, а на общем телефоне — чужой заказ:
        // ключ кэша — только адрес) и застывшие рекорды. Остальное — как у
        // Unity по умолчанию: "no-store".
        cacheControl: function (url) {
          return url === config.dataUrl || url === config.codeUrl || url === config.frameworkUrl
            ? "immutable" : "no-store";
        },
      };

      var loadingScreen = document.querySelector("#game7-loading");
      var progressFull = document.querySelector("#unity-progress-bar-full");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        // Скрипт площадки (SDK) успевает подготовиться до старта игры: язык,
        // звук и сейв нужны ей с первого кадра. Промис не отклоняется.
        // Файлы билда качаются сразу, параллельно с SDK (мост ВК — три
        // запроса, до 4–5 с каждый), а движок ждёт площадку: зависимость
        // запуска Emscripten держит main() до готовности промиса.
        var platformReady = window.game7PlatformReady || Promise.resolve();
        config.preRun = [function (module) {
          module.addRunDependency("game7Platform");
          var release = function () { module.removeRunDependency("game7Platform"); };
          platformReady.then(release, release);
        }];
        createUnityInstance(canvas, config, function (progress) {
          progressFull.style.width = 100 * progress + "%";
          if (!loadHalf && progress >= 0.5) {
            loadHalf = true;
            ymGoal("load_50", { load_sec: Math.round((Date.now() - loadStart) / 100) / 10 });
          }
        }).then(function (instance) {
          window.unityInstance = instance; // знак для smoke и playtest: игра запустилась
          loadingScreen.classList.add("done");
          setTimeout(function () { loadingScreen.style.display = "none"; }, 400);
          canvas.focus();
          ymGoal("load_done", { load_sec: Math.round((Date.now() - loadStart) / 100) / 10, tex: texFormat });
        }).catch(function (message) {
          unityShowBanner(String(message), "error");
          ymGoal("load_error", { message: String(message).slice(0, 200) });
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
