<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a190e">
  <title>Мастерская украшений</title>
  <meta name="ws-build" content="w17-f115554-20261008">
  <!-- Форк game3 «Мастерская украшений» (MVP). Отдельная точка входа:
       main.js/board.js/style.css/платформенные адаптеры game3 НЕ подключены —
       ни рекламы, ни энергии, ни магазина, ни сейвов исходной игры.
       Поле — workshop_board.js, правила — workshop_rules.js, звуки — sound.js. -->
  <link rel="preload" href="workshop_assets/gems.webp?v=17" as="image" type="image/webp">
  <link rel="stylesheet" href="workshop.css?v=17">
</head>
<body>

  <!-- Меню -->
  <div id="screen-menu" class="screen active">
    <div class="ws-menu">
      <h1 class="ws-title">Мастерская<br>украшений</h1>
      <p class="ws-sub">Перекладывайте камни по пробиркам. Четыре одинаковых — и заказчик сам заберёт их.</p>
      <button id="btn-play" class="ws-btn ws-btn-primary ws-btn-hero">Играть</button>
      <div class="ws-play-note" id="ws-play-note"></div>
      <div class="ws-level-grid" id="ws-level-pick" aria-label="Уровни"></div>
      <div class="ws-menu-foot">
        <button id="btn-sound" class="ws-knob" aria-label="Звук" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
        <span class="ws-proto">Прототип · 12 уровней</span>
      </div>
    </div>
  </div>

  <!-- Игра -->
  <div id="screen-workshop" class="screen">
    <div class="ws-root">
      <header class="ws-header">
        <button id="btn-back" class="ws-knob" aria-label="В меню"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="ws-head-mid">
          <div id="ws-level-title" class="ws-level-title"></div>
          <div id="ws-level-name" class="ws-level-name"></div>
        </div>
        <button id="btn-sound-game" class="ws-knob" aria-label="Звук" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
      </header>

      <section class="ws-orders-panel" aria-label="Заказы">
        <div class="ws-status">
          <span class="ws-counter" id="ws-counter" aria-live="polite"></span>
          <span class="ws-moves" id="ws-moves"></span>
        </div>
        <div class="ws-orders" id="ws-orders"></div>
        <div class="ws-queue" id="ws-queue"><span class="ws-queue-label">Далее:</span><span class="ws-queue-items" id="ws-queue-items"></span></div>
      </section>

      <div class="ws-caption" id="ws-caption" aria-live="polite"></div>
      <div class="ws-rescue hidden" id="ws-rescue" role="alert">
        <span id="ws-rescue-text"></span>
        <button id="btn-rescue" class="ws-btn ws-btn-primary ws-btn-small"></button>
      </div>

      <main id="board-wrap" class="ws-board-wrap">
        <canvas id="board-canvas" aria-label="Пробирки с камнями"></canvas>
      </main>

      <footer class="ws-actions">
        <div class="ws-action">
          <button id="btn-undo" class="ws-knob ws-knob-lg" aria-label="Отменить ход"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
          <span>Отменить</span>
        </div>
        <div class="ws-action">
          <button id="btn-hint" class="ws-tile" aria-label="Подсказка">?</button>
          <span>Подсказка</span>
        </div>
        <div class="ws-action">
          <button id="btn-restart" class="ws-knob ws-knob-lg" aria-label="Начать заново"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span>Заново</span>
        </div>
      </footer>
    </div>

    <canvas id="fx-canvas" class="ws-fx"></canvas>
    <div id="hint-toast" class="ws-toast hidden" role="status"></div>

    <!-- Победа: показывается ровно один раз за прохождение уровня -->
    <div id="win-overlay" class="ws-win hidden">
      <div class="ws-win-box">
        <div class="ws-win-title" id="ws-win-title">Все заказы выполнены!</div>
        <canvas id="ws-win-jewel" class="ws-win-jewel" aria-hidden="true"></canvas>
        <div class="ws-win-text" id="ws-win-text"></div>
        <div class="ws-win-master" id="ws-win-master"></div>
        <button id="btn-next" class="ws-btn ws-btn-primary">Дальше</button>
        <div class="ws-win-row">
          <button id="btn-again" class="ws-btn ws-btn-secondary">Ещё раз</button>
          <button id="btn-win-menu" class="ws-btn ws-btn-secondary">Меню</button>
        </div>
      </div>
    </div>
    <canvas id="confetti-canvas" class="ws-confetti"></canvas>
  </div>

  <script src="sfx_data.js?v=17"></script>
  <script src="sound.js?v=17"></script>
  <script src="confetti.js?v=17"></script>
  <script src="workshop_rules.js?v=17"></script>
  <script src="workshop_levels.js?v=17"></script>
  <script src="workshop_board.js?v=17"></script>
  <script src="workshop.js?v=17"></script>
</body>
</html>
