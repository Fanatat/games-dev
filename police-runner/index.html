html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #1b243b;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
/* Экран загрузки Police Runner (tools/make_web_shell.py). */
body {
	background-color: #1b243b;
}

#status-badge {
	width: min(34vw, 34vh, 180px);
	height: auto;
	margin-bottom: 12vh;
	animation: badge-bob 1.1s ease-in-out infinite alternate;
	filter: drop-shadow(0 0.6rem 0.8rem rgba(0, 0, 0, 0.35));
}

@keyframes badge-bob {
	from { transform: translateY(0) rotate(-4deg); }
	to { transform: translateY(-0.8rem) rotate(4deg); }
}

#status-progress {
	-webkit-appearance: none;
	appearance: none;
	bottom: 22%;
	width: min(64vw, 340px);
	height: 16px;
	border: 3px solid rgba(255, 255, 255, 0.85);
	border-radius: 11px;
	background-color: rgba(0, 0, 0, 0.3);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background-color: transparent;
}

#status-progress::-webkit-progress-value {
	background-color: #ffc93c;
	border-radius: 8px;
}

#status-progress::-moz-progress-bar {
	background-color: #ffc93c;
	border-radius: 8px;
}

		<script>
// Police Runner — связка с VK Bridge (этап 7). Godot ходит сюда только из platform/platform_vk.gd.
// Если страница открыта не в VK (нет vk_app_id в адресе) — window.GameVK.active = false и игра
// работает на PlatformMock. VKWebAppInit отправляем сразу, до загрузки движка (требование VK).
(function () {
	'use strict';
	const search = new URLSearchParams(window.location.search);
	const launch = {};
	search.forEach(function (value, key) {
		launch[key] = value;
	});
	const bridge = window.vkBridge;
	const api = {
		active: search.has('vk_app_id') && typeof bridge !== 'undefined',
		// 0 — ждём ответа на VKWebAppInit, 1 — готово, -1 — ошибка.
		initState: 0,
		launch: launch,
		_callback: null,
		_queue: [],
		launchJson: function () {
			return JSON.stringify(launch);
		},
		// Ответ на запрос id придёт в callback строкой JSON { id, ok, data }.
		setCallback: function (callback) {
			api._callback = callback;
			const queued = api._queue;
			api._queue = [];
			queued.forEach(function (text) {
				callback(text);
			});
		},
		send: function (id, method, paramsJson) {
			let params = {};
			try {
				params = JSON.parse(paramsJson || '{}');
			} catch (err) {
				params = {};
			}
			if (!api.active) {
				api._answer(id, false, { error_type: 'client_error', error_data: { error_code: 6 } });
				return;
			}
			try {
				bridge.send(method, params).then(function (data) {
					api._answer(id, true, data);
				}, function (err) {
					api._answer(id, false, err);
				});
			} catch (err) {
				api._answer(id, false, { error_type: 'client_error', error_data: { error_reason: String(err) } });
			}
		},
		_answer: function (id, ok, data) {
			let text;
			try {
				text = JSON.stringify({ id: id, ok: ok, data: data === undefined ? null : data });
			} catch (err) {
				text = JSON.stringify({ id: id, ok: ok, data: null });
			}
			if (api._callback) {
				api._callback(text);
			} else {
				api._queue.push(text);
			}
		},
	};
	if (api.active) {
		bridge.send('VKWebAppInit', {}).then(function () {
			api.initState = 1;
		}, function (err) {
			api.initState = -1;
			console.warn('VKWebAppInit failed', err);
		});
	}
	window.GameVK = api;
}());
		</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":910036,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
