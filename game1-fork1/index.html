<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

</head>
<body>
<div id="app">

  <!-- Первый запуск: шкатулка (ТЗ §5, 0–5 с) -->
  <section class="screen" id="scr-box" hidden>
    <div class="box-art art" data-art="box_intro" data-icon="📦"></div>
    <div class="box-note">
      <p class="note-hand" id="box-note"></p>
      <div class="box-how" aria-hidden="true">
        <span class="bh-tiles"><i>К</i><i>Л</i><i>Ю</i><i>Ч</i></span>
        <span class="bh-arrow">→</span>
        <span class="bh-item art" data-art="key" data-icon="🗝️"></span>
      </div>
      <button class="btn-main" id="btn-open">Открыть</button>
    </div>
  </section>

  <!-- Продолжение / главная -->
  <section class="screen" id="scr-home" hidden>
    <div class="home-scroll">
      <header class="home-head">
        <div>
          <h1 id="home-town">Тихоречье</h1>
          <p class="muted" id="home-chapter"></p>
        </div>
        <div class="head-btns"><button class="icon-btn" id="btn-music" role="switch" aria-label="Музыка"></button><button class="icon-btn" id="btn-sound" role="switch" aria-label="Звук"></button><button class="icon-btn" id="btn-settings" aria-label="Настройки"></button></div>
      </header>
      <div class="card place-card">
        <div class="place-art art" id="home-art" data-art="bg_town" data-icon="🏞️"></div>
        <div class="place-body">
          <p class="place-kicker muted" id="home-kicker"></p>
          <h2 id="home-question"></h2>
          <p class="muted" id="home-sub"></p>
          <button class="btn-main" id="btn-continue">Продолжить историю</button>
        </div>
      </div>
      <div class="home-tiles">
        <button class="card tile" id="btn-town" aria-label="Фонари Тихоречья">
          <span class="tile-icon lamp art" data-art="street_lamp" data-icon="🏮"></span>
          <span class="tile-text"><b id="town-tile-num"></b><span class="bar"><i id="town-tile-bar"></i></span></span>
        </button>
        <button class="card tile" id="btn-atlas" aria-label="Мой атлас">
          <span class="tile-icon art" data-art="atlas_cover" data-icon="📔"></span>
          <span class="tile-text"><b id="atlas-sub"></b><span class="bar"><i id="atlas-tile-bar"></i></span></span>
        </button>
      </div>
      <div class="secret-strip card soft" id="home-secret" hidden></div>
      <p class="save-line muted" id="home-save"></p>
    </div>
  </section>

  <!-- Вступление к истории -->
  <section class="screen" id="scr-intro" hidden>
    <div class="intro-scroll">
      <div class="intro-art art" id="intro-art" data-icon="🏞️"></div>
      <div class="intro-body">
        <p class="muted" id="intro-kicker"></p>
        <h2 id="intro-title"></h2>
        <p class="intro-text" id="intro-text"></p>
        <button class="btn-link" id="btn-intro-home">На главную</button>
      </div>
    </div>
    <!-- главная кнопка всегда у нижнего края, как на итоге (оценка №4, п. 5: на 1366×768 она уходила под край) -->
    <div class="intro-foot"><button class="btn-main" id="btn-intro-go">Искать улики</button></div>
  </section>

  <!-- Поле -->
  <section class="screen" id="scr-field" hidden>
    <header class="field-head">
      <button class="icon-btn" id="btn-back" aria-label="На главную"></button>
      <div class="field-title">
        <b id="field-title"></b>
      </div>
      <div class="dots" id="dots" aria-hidden="true"></div>
    </header>
    <div class="scene" id="scene">
      <div class="scene-bg art" id="scene-bg" data-icon="🏞️"></div>
      <div class="scene-items" id="scene-items"></div>
    </div>
    <div class="clue-card" id="clue-card" aria-live="polite">
      <button class="clue-nav" id="clue-prev" aria-label="Предыдущая улика"></button>
      <div class="clue-main" id="clue-main">
        <p class="clue-text" id="clue-text"></p>
        <p class="clue-extra" id="clue-extra" hidden></p>
        <p class="clue-meta" id="clue-meta" aria-hidden="true"></p>
      </div>
      <div class="clue-reveal" id="clue-reveal" hidden>
        <span class="reveal-icon art" id="reveal-icon"></span>
        <p id="reveal-text"></p>
      </div>
      <button class="clue-nav" id="clue-next" aria-label="Следующая улика"></button>
    </div>
    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board" tabindex="0" aria-label="Поле букв. Стрелки — выбор клетки, пробел — добавить, Enter — проверить, Escape — сбросить"></div>
      <svg class="board-lines" id="board-lines" aria-hidden="true"></svg>
    </div>
    <footer class="field-foot">
      <span class="stamps" id="stamps" data-counter="stamps"><span class="st-img art" data-art="golden_stamp" data-icon="🏅"></span><b id="stamps-n"></b></span>
      <button class="btn-hint" id="btn-hint"><span class="hint-img art" data-art="magnifier" data-icon="🔍"></span><span class="hint-price" id="hint-price" data-counter="hint"></span></button>
    </footer>
    <p class="save-warn" id="field-save" hidden>Сейчас прогресс не сохраняется</p>
  </section>

  <!-- Итог истории -->
  <section class="screen" id="scr-result" hidden>
    <div class="result-scroll">
      <div class="scene result-scene" id="result-scene">
        <div class="scene-bg art" id="result-bg" data-icon="🏞️"></div>
        <div class="scene-items" id="result-items"></div>
      </div>
      <div class="result-body">
        <button class="chip res-atlas-chip" id="res-atlas-chip" aria-label="Атлас"></button>
        <p class="muted" id="result-kicker">Разгадано!</p>
        <h2 id="result-title"></h2>
        <!-- крючок наверху: вопрос следующей истории виден без прокрутки (оценка №4, круг 2, п. 2.1) -->
        <div class="card question" id="result-question-card">
          <span class="muted" id="result-question-kicker">Следующий вопрос</span>
          <b id="result-question"></b>
        </div>
        <button class="btn-link ending-toggle" id="btn-ending" aria-expanded="false" aria-controls="result-ending">Развязка</button>
        <p id="result-ending" hidden></p>
        <div class="card keepsake" id="result-keepsake">
          <span class="keepsake-img art" id="keepsake-img"></span>
          <span><b id="keepsake-title"></b><span class="muted" id="keepsake-note"></span><span class="reward-line" id="reward-line"></span></span>
        </div>
        <!-- фонарь места — выбор игрока: марки на фонарь или на подсказки -->
        <button class="card btn-lantern" id="btn-lantern" hidden></button>
        <div class="secret-strip card soft" id="result-secret" hidden></div>
        <div class="card soft" id="demo-end" hidden>
          <b id="demo-end-title"></b>
          <span id="demo-end-text"></span>
        </div>
      </div>
    </div>
    <!-- главная кнопка — под прокруткой, а не поверх наград (оценка b007, п. 21) -->
    <div class="result-foot">
      <div class="foot-row">
        <button class="icon-btn home-btn" id="btn-res-home" aria-label="На главную"></button>
        <button class="btn-main" id="btn-next">Следующая история</button>
      </div>
    </div>
  </section>

  <!-- Атлас -->
  <section class="screen" id="scr-atlas" hidden>
    <header class="field-head">
      <button class="icon-btn" id="btn-atlas-back" aria-label="Назад"></button>
      <div class="field-title"><b>Мой атлас</b><span class="muted" id="atlas-page-sub"></span></div>
    </header>
    <div class="atlas-scroll">
      <div class="atlas-cover art" data-art="atlas_cover" data-icon="📔"></div>
      <div class="wallet" id="wallet"></div>
      <div class="secret-strip card soft" id="atlas-secret" hidden></div>
      <div class="atlas-tabs" id="atlas-tabs"></div>
      <h3 class="atlas-h" id="atlas-h">Первые открытия</h3>
      <div class="atlas-grid" id="atlas-grid"></div>
      <button class="btn-main" id="btn-atlas-home">На главную</button>
    </div>
  </section>


  <!-- Финал главы (ТЗ §6.2) -->
  <section class="screen" id="scr-finale" hidden>
    <div class="finale-scroll">
      <div class="finale-bg art" data-art="bg_town" data-icon="🏞️"></div>
      <div class="finale-body">
        <p class="muted" id="finale-kicker">Глава 1 пройдена</p>
        <h2 id="finale-title"></h2>
        <p id="finale-text"></p>
        <div class="finale-grid" id="finale-grid"></div>
        <div class="reward-line finale-reward" id="finale-reward"></div>
        <div class="secret-strip card soft" id="finale-secret"></div>
        <div class="card question"><span class="muted" id="finale-q-label">Глава 2</span><b id="finale-question"></b></div>
      </div>
    </div>
    <div class="result-foot">
      <button class="btn-main" id="btn-finale-next">Глава 2</button>
      <div class="link-row">
        <button class="btn-link" id="btn-finale-atlas">Атлас</button>
        <button class="btn-link" id="btn-finale-home">На главную</button>
      </div>
    </div>
  </section>

  <!-- Фонари Тихоречья: на что тратить марки -->
  <section class="screen" id="scr-town" hidden>
    <header class="field-head">
      <button class="icon-btn" id="btn-town-back" aria-label="Назад"></button>
      <div class="field-title"><b>Фонари Тихоречья</b><span class="muted" id="town-sub"></span></div>
    </header>
    <div class="town-scroll">
      <div class="town-map">
        <div class="town-bg art" data-art="bg_town" data-icon="🏞️"></div>
        <div class="town-lamps" id="town-lamps"></div>
      </div>
      <div class="town-list" id="town-list"></div>
    </div>
  </section>

  <!-- Шторка: помощь / настройки / подтверждение -->
  <div class="sheet-back" id="sheet-back" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
</div>
