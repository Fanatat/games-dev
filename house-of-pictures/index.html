<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2V20a1 1 0 0 1-1 1h-5.2v-6h-5.6v6H4a1 1 0 0 1-1-1z" fill="currentColor"/></symbol>

    <symbol id="i-cross" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 7 4 12l5 5" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 12h9a5.5 5.5 0 0 1 0 11h-3" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" transform="translate(0 -4)"/></symbol>
    <symbol id="i-hint" viewBox="0 0 24 24"><path d="M12 2.5a6.8 6.8 0 0 0-4 12.3c.7.5 1 1.2 1 2V18h6v-1.2c0-.8.4-1.5 1-2a6.8 6.8 0 0 0-4-12.3z" fill="currentColor"/><rect x="9" y="19.3" width="6" height="2.4" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.6 1.9.8 2.2-1.5 2.4 2.4-1.5 2.2.8 1.9 2.6.5v3.4l-2.6.5-.8 1.9 1.5 2.2-2.4 2.4-2.2-1.5-1.9.8-.5 2.6h-3.4l-.5-2.6-1.9-.8-2.2 1.5-2.4-2.4 1.5-2.2-.8-1.9L1.4 13.7v-3.4l2.6-.5.8-1.9-1.5-2.2 2.4-2.4 2.2 1.5 1.9-.8zM12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8z" fill="currentColor" fill-rule="evenodd"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M3 9h4l5-4.5v15L7 15H3z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.3 5.8a9 9 0 0 1 0 12.4" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-vibro" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.2" fill="currentColor"/><path d="M3.5 8v8M20.5 8v8" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
    <symbol id="i-motion" viewBox="0 0 24 24"><circle cx="15" cy="12" r="5.5" fill="currentColor"/><path d="M2.5 8h5M1.5 12h5M2.5 16h5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>

    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" stroke="currentColor" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10.5" rx="2.2" fill="currentColor"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" stroke="currentColor" stroke-width="2.4" fill="none"/></symbol>
    <symbol id="i-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18c1.3 0 2-.8 2-1.8 0-1.4-1.3-1.7-1.3-3 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4C21 6.5 17 3 12 3z" fill="currentColor"/><circle cx="7.5" cy="11" r="1.5" fill="#fff"/><circle cx="10" cy="7" r="1.5" fill="#fff"/><circle cx="14.5" cy="7" r="1.5" fill="#fff"/></symbol>

<div id="app" class="app">
  <div class="shell" id="shell">
    <header class="topbar hud" id="hud">
      <button class="chip cur cur-coins" id="hud-coins" aria-label="Монеты" hidden><img src="assets/art/coin.webp" alt=""><b id="hud-coins-n">0</b></button>
      <button class="chip cur cur-pencils" id="hud-pencils" aria-label="Карандаши" hidden><img src="assets/art/pencil.webp" alt=""><b id="hud-pencils-n">0</b></button>
      <span class="hud-gap"></span>
      <button class="tile tile-round" id="btn-settings" aria-label="Настройки"><svg class="ico"><use href="#i-gear"/></svg></button>
    </header>

    <!-- Дом -->
    <section id="screen-home" class="screen screen-home" aria-label="Дом">
      <div class="home-body">
        <div class="scene-wrap">
          <div class="scene-frame">
            <div class="scene" id="scene"></div>
            <button class="room-pill" id="room-pill" aria-label="Комнаты"><svg class="ico"><use href="#i-home"/></svg><span id="room-title"></span><small id="room-count"></small></button>
          </div>
        </div>
        <div class="panel" id="home-panel" aria-live="polite"></div>
      </div>
    </section>

    <!-- Письма -->
    <section id="screen-letters" class="screen screen-page" aria-label="Письма" hidden>
      <div class="page" id="letters-page"></div>
    </section>

    <!-- Лавка -->
    <section id="screen-shop" class="screen screen-page" aria-label="Лавка" hidden>
      <div class="page" id="shop-page"></div>
    </section>

    <nav class="tabbar" id="tabbar" aria-label="Разделы" hidden>
      <button class="tab" data-tab="home" aria-label="Дом"><svg class="ico"><use href="#i-home"/></svg><span>Дом</span></button>
      <button class="tab" data-tab="letters" aria-label="Письма"><img src="assets/art/envelope.webp" alt=""><span>Письма</span><i class="tab-dot" id="tab-letters-dot" hidden></i></button>
      <button class="tab" data-tab="shop" aria-label="Лавка"><img src="assets/art/basket.webp" alt=""><span>Лавка</span></button>
    </nav>
  </div>

  <!-- Поле -->
  <section id="screen-puzzle" class="screen screen-puzzle" aria-label="Картинка" hidden>
    <header class="topbar">
      <button class="tile tile-round" id="btn-home" aria-label="Домой"><svg class="ico"><use href="#i-home"/></svg></button>
      <div class="puzzle-title"><span id="puzzle-title"></span><small id="puzzle-size"></small></div>
      <div class="puzzle-preview" id="puzzle-preview" aria-hidden="true"></div>
    </header>
    <div class="puzzle-area">
      <div class="coach" id="coach" hidden><span id="coach-text"></span></div>
      <div class="puzzle-container" id="puzzle-container"></div>
      <div class="reveal" id="reveal" hidden></div>
    </div>
    <nav class="toolbar" id="toolbar" aria-label="Инструменты">
      <div class="seg" role="radiogroup" aria-label="Режим">
        <button class="tile tool is-on" id="mode-fill" role="radio" aria-checked="true" aria-label="Закрашивать"><svg class="ico"><use href="#i-fill"/></svg></button>
        <button class="tile tool" id="mode-cross" data-key="X" role="radio" aria-checked="false" aria-label="Ставить крестик"><svg class="ico"><use href="#i-cross"/></svg></button>
      </div>
      <button class="tile tool" id="btn-undo" data-key="Z" aria-label="Отменить ход" disabled><svg class="ico"><use href="#i-undo"/></svg></button>
      <button class="tile tool" id="btn-hint" data-key="H" aria-label="Подсказка"><svg class="ico"><use href="#i-hint"/></svg></button>
      <button class="tile tool tool-pencil" id="btn-pencil" data-key="P" aria-label="Карандаш: открыть строку" hidden><img src="assets/art/pencil.webp" alt=""><b class="count" id="pencil-n">0</b></button>
    </nav>
    <div class="pick-bar" id="pick-bar" hidden>
      <span class="pick-text" id="pick-text"></span>
      <button class="tile tile-round" id="pick-cancel" aria-label="Отмена"><svg class="ico"><use href="#i-close"/></svg></button>
      <button class="btn-pick" id="pick-ok" aria-label="Открыть линию"><svg class="ico"><use href="#i-check"/></svg><img src="assets/art/pencil.webp" alt=""><b>−1</b></button>
    </div>
  </section>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <div class="fx-layer" id="fx" aria-hidden="true"></div>
</div>

<script src="data/content.js?v=003"></script>
<script src="src/state.js?v=003"></script>
<script src="src/puzzle/nonogram_logic.js?v=003"></script>
<script src="src/puzzle/nonogram.js?v=003"></script>
<script src="src/sound.js?v=003"></script>
<script src="src/platform.js?v=003"></script>
<script src="src/cloud.js?v=003"></script>
<script src="src/scene.js?v=003"></script>
<script src="src/app.js?v=003"></script>
</body>
</html>
