<body>
<!-- Сборка: tools/build.mjs подставляет %…% (штамп, адрес шрифта, CSS, скрипт). Тексты — только data-i18n.
     Экраны — [data-screen], кнопки — [data-ui] (по ним жмёт бот-тестировщик). Значки — img[data-icon="имя"]:
     адрес подставляет ui/screens.ts (assets/art/ui/<имя>.png, значки оружия и монета — assets/art/). -->
<canvas id="game"></canvas>
<div id="ui">
  <!-- Загрузка: название и полоса (прогресса у загрузки нет, полоса бегает, пока идёт подготовка). -->
  <section class="screen screen--loading is-on" data-screen="loading">
    <div class="title" data-i18n="BB_GAME_TITLE">Коп Ленд</div>
    <div class="loadbar"><i></i></div>
  </section>

  <!-- Главный: «УРОВЕНЬ N», цепочка уровней, следующее оружие, рука-подсказка, большая ▶. Тап в любом месте = старт. -->
  <section class="screen screen--main" data-screen="main" data-ui="main">
    <button class="icon-btn icon-btn--tl" data-ui="sound" type="button"><img data-icon="sound_on" alt=""></button>
    <div class="topright">
      <div class="coins"><img class="coin-ico" data-icon="coin" alt=""><span data-ui="main-coins">0</span></div>
      <button class="icon-btn" data-ui="brush" type="button"><img data-icon="brush" alt=""></button>
      <!-- Соц-значки без текста (SocialPromptManager решает, видны ли): окон между уровнями нет. -->
      <button class="icon-btn icon-btn--soc is-hidden" data-ui="soc-fav" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      </button>
      <button class="icon-btn icon-btn--soc is-hidden" data-ui="soc-join" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8" r="3.3"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2 20c0-3.6 2.8-6 6.5-6s6.5 2.4 6.5 6zM14.5 20c0-1.9-.6-3.4-1.6-4.5.9-.4 1.8-.6 2.6-.6 3 0 5.5 1.8 5.5 5.1z"/></svg>
      </button>
    </div>
    <div class="main-info">
      <div class="weapon" data-ui="main-weapon">
        <div class="rays"></div>
        <img class="weapon__img" data-ui="main-weapon-img" alt="">
        <div class="weapon__pct" data-ui="main-weapon-pct"></div>
      </div>
      <div class="title title--level" data-ui="main-level"></div>
      <div class="chain" data-ui="main-chain"></div>
    </div>
    <div class="handzone"><img class="handzone__arrow" data-icon="swipe_arrow" alt=""><img class="handzone__hand" data-icon="hand" alt=""></div>
    <div class="main-bottom">
      <button class="bonus" data-ui="bonus" type="button"><img data-icon="ad" alt=""><span class="bonus__n"><img data-icon="cop" alt=""><b data-ui="bonus-n"></b></span></button>
      <button class="round round--play" data-ui="play" type="button"><img data-icon="play" alt=""></button>
    </div>
  </section>

  <section class="screen screen--hud" data-screen="hud">
    <!-- HUD [модуль «HUD и визуал»]: стили — блок HUD в styles.css -->
    <div class="hud-top" data-ui="hud-top">
      <div class="hud-row">
        <button class="hud-pause" data-ui="hud-pause" type="button"><i></i><i></i></button>
        <div class="hud-prog" data-ui="hud-prog">
          <div class="hud-progress"><div class="hud-bar" data-ui="hud-bar"></div></div>
          <div class="hud-pct" data-ui="hud-pct"></div>
        </div>
        <div class="hud-coinbox" data-ui="hud-coinbox"><span class="hud-coin" data-ui="hud-coin-icon"></span><span data-ui="hud-coins">0</span></div>
      </div>
      <div class="hud-boss" data-ui="hud-boss">
        <div class="hud-boss__bar"><div class="hud-boss__fill" data-ui="hud-boss-fill"></div><span class="hud-boss__num" data-ui="hud-boss-num"></span></div>
      </div>
    </div>
    <div class="hud-units-box" data-ui="hud-units-box"><span class="hud-units-tag" data-ui="hud-units-tag"></span><span class="hud-units" data-ui="hud-units">0</span></div>
    <div class="hud-fps" data-ui="hud-fps" hidden></div>
  </section>

  <!-- Возрождение: круговой таймер вокруг большой кнопки ролика, «нет» появляется через секунду. -->
  <section class="screen screen--dim" data-screen="revive">
    <div class="ringbox" data-ui="revive-ring">
      <svg class="ring" viewBox="0 0 100 100"><circle class="ring__bg" cx="50" cy="50" r="46"/><circle class="ring__fg" cx="50" cy="50" r="46" pathLength="100"/></svg>
      <button class="round round--ad" data-ui="revive" type="button">
        <img data-icon="ad" alt="">
        <span class="round__n"><img data-icon="cop" alt=""><b data-ui="revive-n"></b></span>
      </button>
    </div>
    <button class="icon-btn icon-btn--x btn--late" data-ui="revive-skip" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </section>

  <!-- Отсчёт 3-2-1 после ролика: забег продолжается на «ноль». -->
  <section class="screen screen--count" data-screen="count">
    <div class="count" data-ui="count"></div>
  </section>

  <!-- Знак «▶ +N» на дороге: предложение ролика (бойцы в подарок), само пропадает. -->
  <section class="screen screen--dim" data-screen="sign">
    <div class="ringbox ringbox--small" data-ui="sign-ring">
      <svg class="ring" viewBox="0 0 100 100"><circle class="ring__bg" cx="50" cy="50" r="46"/><circle class="ring__fg" cx="50" cy="50" r="46" pathLength="100"/></svg>
      <button class="round round--ad" data-ui="sign-accept" type="button">
        <img data-icon="ad" alt="">
        <span class="round__n"><img data-icon="cop" alt=""><b data-ui="sign-n"></b></span>
      </button>
    </div>
    <button class="icon-btn icon-btn--x" data-ui="sign-skip" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </section>

  <!-- Победа: «УРОВЕНЬ ПРОЙДЕН», следующее оружие, монеты, ×2 за ролик, круглая ▶ через ui.resultButtonDelaySec. -->
  <section class="screen screen--modal" data-screen="win">
    <button class="icon-btn icon-btn--tl" data-ui="win-share" type="button"><img data-icon="trophy" alt=""></button>
    <button class="icon-btn icon-btn--tr" data-ui="win-brush" type="button"><img data-icon="brush" alt=""></button>
    <div class="banner banner--win">
      <div class="banner__title" data-i18n="BB_WIN_TITLE"></div>
      <div class="banner__pct" data-i18n-args="100" data-i18n="HUD_PERCENT"></div>
      <div class="meter"><i style="--p:1"></i></div>
    </div>
    <div class="weapon weapon--big" data-ui="win-weapon">
      <div class="rays"></div>
      <img class="weapon__img" data-ui="win-weapon-img" alt="">
      <div class="weapon__pct" data-ui="win-weapon-pct"></div>
    </div>
    <div class="stack">
      <div class="reward"><span data-ui="win-reward"></span><img class="coin-ico" data-icon="coin" alt=""></div>
      <div class="row">
        <button class="btn btn--ad" data-ui="win-double" type="button"><img data-icon="ad" alt=""><span data-i18n="WIN_DOUBLE"></span></button>
        <button class="round round--play btn--late" data-ui="win-next" type="button"><img data-icon="play" alt=""></button>
      </div>
    </div>
  </section>

  <!-- Поражение: «ЕЩЁ РАЗ», сколько пройдено, большая круглая ↻ — сразу заново тот же уровень. -->
  <section class="screen screen--modal" data-screen="lose">
    <div class="banner banner--lose">
      <div class="banner__title banner__title--danger" data-i18n="LOSE_TITLE"></div>
      <div class="banner__pct" data-ui="lose-pct"></div>
      <div class="meter"><i data-ui="lose-bar"></i></div>
    </div>
    <div class="weapon weapon--big weapon--dark" data-ui="lose-weapon">
      <div class="rays"></div>
      <img class="weapon__img" data-ui="lose-weapon-img" alt="">
      <div class="weapon__pct" data-ui="lose-weapon-pct"></div>
    </div>
    <div class="stack"><button class="round round--play" data-ui="lose-restart" type="button"><img data-icon="restart" alt=""></button></div>
  </section>

  <!-- Пауза: продолжить / звук / заново — значки. -->
  <section class="screen screen--modal" data-screen="pause">
    <div class="card card--row">
      <button class="round round--play" data-ui="pause-resume" type="button"><img data-icon="play" alt=""></button>
      <button class="round round--blue" data-ui="pause-sound" type="button"><img data-icon="sound_on" alt=""></button>
      <button class="round round--blue" data-ui="pause-restart" type="button"><img data-icon="restart" alt=""></button>
    </div>
  </section>

  <!-- Цвет отряда: один выбор цвета (не магазин). Платный — монеты или ролик. -->
  <section class="screen screen--modal" data-screen="colors" data-ui="colors">
    <div class="card card--colors">
      <img class="colors__cop" data-icon="cop" alt="">
      <div class="swatches">
        <button class="swatch" data-ui="color-0" type="button"></button>
        <button class="swatch" data-ui="color-1" type="button"></button>
        <button class="swatch" data-ui="color-2" type="button"></button>
        <button class="swatch" data-ui="color-3" type="button"></button>
      </div>
      <button class="btn btn--link" data-ui="colors-close" type="button">×</button>
    </div>
  </section>

  <!-- Соц-предложение (между уровнями, не чаще правил SocialPromptManager). -->
  <section class="screen screen--modal" data-screen="error">
    <div class="card"><div class="sub" data-i18n="BB_ERROR">Could not load the game. Please reload the page.</div></div>
  </section>

  <div class="stamp" data-ui="stamp">bb6 · 755d590 · 14.10 18:30</div>
</div>
<script type="module" src="a/main.afba19a2d9.js"></script>
</body>
</html>
