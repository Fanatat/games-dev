     Экраны — [data-screen], кнопки — [data-ui] (по ним жмёт бот-тестировщик). Значки — img[data-icon="имя"]:
     адрес подставляет ui/screens.ts (assets/art/ui/<имя>.png, значки оружия и монета — assets/art/). -->
<!-- Рисунки тизера «Дальше» (#ti-…) и причины поражения (#lc-…): ui/screens.ts ставит их через <use>. -->
<svg class="sprite" aria-hidden="true" width="0" height="0">
  <defs>
    <symbol id="ti-mul" viewBox="0 0 64 64"><rect x="7" y="9" width="50" height="46" rx="9" fill="#2f8bff" stroke="#0b1830" stroke-width="3"/><text x="32" y="43" text-anchor="middle" font-size="27" font-weight="900" font-family="Rubik, sans-serif" fill="#fff" stroke="#0b1830" stroke-width="3" paint-order="stroke">×2</text></symbol>
    <symbol id="ti-grow" viewBox="0 0 64 64"><rect x="7" y="9" width="50" height="46" rx="9" fill="#2fbf5b" stroke="#0b1830" stroke-width="3"/><path d="M32 14L47 31H38V50H26V31H17Z" fill="#fff" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="ti-roller" viewBox="0 0 64 64"><polygon points="32.0,8.0 37.6,16.9 47.3,13.0 46.6,23.4 56.7,26.0 50.0,34.0 56.7,42.0 46.6,44.6 47.3,55.0 37.6,51.1 32.0,60.0 26.4,51.1 16.7,55.0 17.4,44.6 7.3,42.0 14.0,34.0 7.3,26.0 17.4,23.4 16.7,13.0 26.4,16.9" fill="#b9c3cf" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/><circle cx="32" cy="34" r="12" fill="#6b7787" stroke="#0b1830" stroke-width="3"/><circle cx="32" cy="34" r="4" fill="#0b1830"/></symbol>
    <symbol id="ti-truck" viewBox="0 0 64 64"><rect x="4" y="16" width="34" height="28" rx="3" fill="#ff8a1f" stroke="#0b1830" stroke-width="3"/><path d="M38 24H50L59 34V44H38Z" fill="#ffd23f" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/><path d="M42 27H49L54 33H42Z" fill="#8fd3e8"/><circle cx="15" cy="46" r="7" fill="#2b3442" stroke="#0b1830" stroke-width="3"/><circle cx="48" cy="46" r="7" fill="#2b3442" stroke="#0b1830" stroke-width="3"/></symbol>
    <symbol id="ti-bridge" viewBox="0 0 64 64"><circle cx="45" cy="20" r="11" fill="#ff8a3d" stroke="#0b1830" stroke-width="3"/><path d="M5 50Q32 8 59 50" fill="none" stroke="#0b1830" stroke-width="8"/><path d="M5 50Q32 8 59 50" fill="none" stroke="#d6453a" stroke-width="4"/><path d="M18 32V42M32 24V42M46 32V42" stroke="#0b1830" stroke-width="3"/><rect x="2" y="42" width="60" height="9" rx="2" fill="#7a4a8c" stroke="#0b1830" stroke-width="3"/></symbol>
    <symbol id="ti-boss" viewBox="0 0 64 64"><polygon points="32.0,2.0 36.4,15.6 47.0,6.0 44.0,20.0 58.0,17.0 48.4,27.6 62.0,32.0 48.4,36.4 58.0,47.0 44.0,44.0 47.0,58.0 36.4,48.4 32.0,62.0 27.6,48.4 17.0,58.0 20.0,44.0 6.0,47.0 15.6,36.4 2.0,32.0 15.6,27.6 6.0,17.0 20.0,20.0 17.0,6.0 27.6,15.6" fill="#ff3b30" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/><polygon points="32.0,14.0 34.6,22.3 41.0,16.4 39.1,24.9 47.6,23.0 41.7,29.4 50.0,32.0 41.7,34.6 47.6,41.0 39.1,39.1 41.0,47.6 34.6,41.7 32.0,50.0 29.4,41.7 23.0,47.6 24.9,39.1 16.4,41.0 22.3,34.6 14.0,32.0 22.3,29.4 16.4,23.0 24.9,24.9 23.0,16.4 29.4,22.3" fill="#ffd23f"/><path d="M27 18H37V32H43L32 46L21 32H27Z" fill="#fff" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="ti-boom" viewBox="0 0 64 64"><polygon points="37.2,2.5 39.5,19.0 55.0,12.7 46.1,26.9 62.0,32.0 46.1,37.1 55.0,51.3 39.5,45.0 37.2,61.5 29.4,46.8 17.0,58.0 20.5,41.6 3.8,42.3 17.0,32.0 3.8,21.7 20.5,22.4 17.0,6.0 29.4,17.2" fill="#ff7a1a" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/><polygon points="35.0,15.3 36.0,25.1 45.0,21.1 39.5,29.3 49.0,32.0 39.5,34.7 45.0,42.9 36.0,38.9 35.0,48.7 30.6,39.9 23.5,46.7 25.9,37.1 16.0,37.8 24.0,32.0 16.0,26.2 25.9,26.9 23.5,17.3 30.6,24.1" fill="#fff3a0"/></symbol>
    <symbol id="ti-tough" viewBox="0 0 64 64"><path d="M47 30L61 35V45C61 53 55 59 47 62C39 59 33 53 33 45V35Z" fill="#7d93b5" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/><path d="M47 36V56" stroke="#dfe7f2" stroke-width="3"/></symbol>
    <symbol id="ti-elite" viewBox="0 0 64 64"><polygon points="48.0,2.0 51.5,11.1 61.3,11.7 53.7,17.9 56.2,27.3 48.0,22.0 39.8,27.3 42.3,17.9 34.7,11.7 44.5,11.1" fill="#ffd23f" stroke="#0b1830" stroke-width="3" stroke-linejoin="round"/></symbol>
    <symbol id="ti-crush" viewBox="0 0 64 64"><g stroke="#0b1830" stroke-width="3"><circle cx="15" cy="40" r="11" fill="#f2c29b"/><path d="M4 38A11 11 0 0 1 26 38Z" fill="#e0342b"/><circle cx="49" cy="40" r="11" fill="#f2c29b"/><path d="M38 38A11 11 0 0 1 60 38Z" fill="#e0342b"/><circle cx="32" cy="30" r="13" fill="#f2c29b"/><path d="M19 28A13 13 0 0 1 45 28Z" fill="#e0342b"/></g><path d="M8 58H56" stroke="#e0342b" stroke-width="5" stroke-linecap="round"/></symbol>
    <symbol id="lc-breach" viewBox="0 0 64 64"><rect x="2" y="46" width="60" height="10" rx="2" fill="#fff" stroke="#0b1830" stroke-width="3"/><path d="M10 47L4 55M22 47L16 55M34 47L28 55M46 47L40 55M58 47L52 55" stroke="#e0342b" stroke-width="5"/><path d="M50 22V40H44L54 52L64 40H58V22Z" fill="#ff3b30" stroke="#0b1830" stroke-width="3" stroke-linejoin="round" transform="translate(-6 4)"/></symbol>
    <symbol id="lc-squad" viewBox="0 0 64 64"><path d="M14 14L50 50M50 14L14 50" stroke="#0b1830" stroke-width="10" stroke-linecap="round"/><path d="M14 14L50 50M50 14L14 50" stroke="#ff3b30" stroke-width="5" stroke-linecap="round"/></symbol>
  </defs>
</svg>
<canvas id="game"></canvas>
<div id="ui">
  <!-- Загрузка: название и полоса (прогресса у загрузки нет, полоса бегает, пока идёт подготовка). -->
  <section class="screen screen--loading is-on" data-screen="loading">
    <div class="title" data-i18n="BB_GAME_TITLE">Коп Ленд</div>
    <div class="loadbar"><i></i></div>
  </section>

  <!-- Главный: «УРОВЕНЬ N», цепочка уровней, следующее оружие, рука-подсказка, большая ▶. Тап по пустому месту = старт;
       тап по шапке и блокам с data-guard (их можно рассматривать) забег не запускает (bb9, UX-02). -->
  <section class="screen screen--main" data-screen="main" data-ui="main">
    <button class="icon-btn icon-btn--tl" data-ui="sound" type="button" data-i18n-aria="BB_A_SOUND"><img data-icon="sound_on" alt=""></button>
    <!-- «Как играть» (окно info; из него — «Поддержка»). -->
    <button class="icon-btn icon-btn--tl2 icon-btn--svg" data-ui="help" type="button" data-i18n-aria="BB_HELP_TITLE"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 8.8a3.5 3.5 0 1 1 5.2 3.1c-1.2.7-1.8 1.4-1.8 2.8v.6"/><circle cx="12" cy="19" r="1.3"/></svg></button>
    <div class="topright">
      <div class="coins"><img class="coin-ico" data-icon="coin" alt=""><span data-ui="main-coins">0</span></div>
      <button class="icon-btn" data-ui="brush" type="button" data-i18n-aria="BB_COLOR_TITLE"><img data-icon="brush" alt=""></button>
      <!-- Соц-значки без текста (SocialPromptManager решает, видны ли): окон между уровнями нет. -->
      <button class="icon-btn icon-btn--soc is-hidden" data-ui="soc-fav" type="button" data-i18n-aria="BB_A_FAV">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6L2.5 9.4l6.6-.8z"/></svg>
      </button>
      <button class="icon-btn icon-btn--soc is-hidden" data-ui="soc-join" type="button" data-i18n-aria="BB_A_JOIN">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8.5" cy="8" r="3.3"/><circle cx="16.5" cy="9" r="2.7"/><path d="M2 20c0-3.6 2.8-6 6.5-6s6.5 2.4 6.5 6zM14.5 20c0-1.9-.6-3.4-1.6-4.5.9-.4 1.8-.6 2.6-.6 3 0 5.5 1.8 5.5 5.1z"/></svg>
      </button>
    </div>
    <!-- Шапка (data-guard): тап по ней не запускает забег — её можно рассматривать. Оружие — с первой победы. -->
    <div class="main-info" data-guard>
      <div class="title title--level" data-ui="main-level"></div>
      <div class="chain" data-ui="main-chain"></div>
      <div class="unlock" data-ui="main-weapon" hidden>
        <div class="unlock__pic"><img class="weapon__img" data-ui="main-weapon-img" alt=""></div>
        <div class="unlock__body">
          <div class="unlock__title" data-ui="main-weapon-title"></div>
          <div class="segs" data-ui="main-weapon-segs"></div>
          <div class="unlock__sub" data-ui="main-weapon-sub" data-i18n="BB_WEAPON_NEXT_RUN" hidden></div>
        </div>
      </div>
    </div>
    <div class="handzone"><img class="handzone__arrow" data-icon="swipe_arrow" alt=""><img class="handzone__hand" data-icon="hand" alt=""></div>
    <div class="handzone__cap only-mouse" data-i18n="BB_HOW_MOVE_PC"></div>
    <div class="main-bottom">
      <button class="bonus" data-ui="bonus" type="button" data-i18n-aria="BB_A_BONUS"><img data-icon="ad" alt=""><span class="bonus__n"><img data-icon="cop" alt=""><b data-ui="bonus-n"></b></span></button>
      <button class="round round--play" data-ui="play" type="button" data-i18n-aria="BB_A_PLAY"><img data-icon="play" alt=""></button>
    </div>
  </section>

  <section class="screen screen--hud" data-screen="hud">
    <!-- HUD [модуль «HUD и визуал»]: стили — блок HUD в styles.css -->
    <div class="hud-top" data-ui="hud-top">
      <div class="hud-row">
        <button class="hud-pause" data-ui="hud-pause" type="button" data-i18n-aria="BB_A_PAUSE"><i></i><i></i></button>
        <div class="hud-prog" data-ui="hud-prog">
          <div class="hud-progress"><div class="hud-bar" data-ui="hud-bar"></div></div>
          <div class="hud-pct" data-ui="hud-pct"></div>
        </div>
        <div class="hud-coinbox" data-ui="hud-coinbox"><span class="hud-coin" data-ui="hud-coin-icon"></span><span data-ui="hud-coins">0</span></div>
      </div>
      <div class="hud-boss" data-ui="hud-boss">
        <div class="hud-boss__bar"><div class="hud-boss__fill" data-ui="hud-boss-fill"></div><span class="hud-boss__num" data-ui="hud-boss-num"></span></div>
      </div>
    </div>
    <div class="hud-units-box" data-ui="hud-units-box"><span class="hud-units-tag" data-ui="hud-units-tag"></span><span class="hud-units" data-ui="hud-units">0</span></div>
    <div class="hud-fps" data-ui="hud-fps" hidden></div>
    <!-- Пометки поверх мира (ui/hud_marks.ts): отрезки рубежа под угрозой, вспышка прорыва, подсказка L1. -->
    <div class="hud-marks" data-ui="hud-marks">
      <div class="hud-breach" data-ui="hud-breach"><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ti-boom"/></svg><img data-icon="bandit" alt=""></div>
      <div class="hud-hint" data-ui="hud-hint" hidden><div class="hud-hint__arrow"></div><img class="hud-hint__hand" data-icon="hand" alt=""><span class="hud-hint__cap" data-i18n="BB_HINT_MOVE"></span></div>
    </div>
  </section>

  <!-- Возрождение: «Продолжить?», круговой таймер вокруг кнопки ролика (+N бойцов), «Нет, спасибо» — сразу. -->
  <section class="screen screen--dim" data-screen="revive">
    <div class="dim-title" data-i18n="BB_REVIVE_Q"></div>
    <div class="ringbox" data-ui="revive-ring">
      <svg class="ring" viewBox="0 0 100 100"><circle class="ring__bg" cx="50" cy="50" r="46"/><circle class="ring__fg" cx="50" cy="50" r="46" pathLength="100"/></svg>
      <button class="round round--ad" data-ui="revive" type="button" data-i18n-aria="BB_A_REVIVE">
        <img data-icon="ad" alt="">
        <span class="round__n"><img data-icon="cop" alt=""><b data-ui="revive-n"></b></span>
      </button>
    </div>
    <button class="btn btn--text btn--late" data-ui="revive-skip" type="button" data-i18n="BB_NO_THANKS"></button>
  </section>

  <!-- Отсчёт 3-2-1 после ролика: забег продолжается на «ноль». -->
  <section class="screen screen--count" data-screen="count">
    <div class="count" data-ui="count"></div>
  </section>

  <!-- Знак «▶ +N» на дороге: предложение ролика (бойцы в подарок), само пропадает. -->
  <section class="screen screen--dim" data-screen="sign">
    <div class="ringbox ringbox--small" data-ui="sign-ring">
      <svg class="ring" viewBox="0 0 100 100"><circle class="ring__bg" cx="50" cy="50" r="46"/><circle class="ring__fg" cx="50" cy="50" r="46" pathLength="100"/></svg>
      <button class="round round--ad" data-ui="sign-accept" type="button" data-i18n-aria="BB_A_BONUS">
        <img data-icon="ad" alt="">
        <span class="round__n"><img data-icon="cop" alt=""><b data-ui="sign-n"></b></span>
      </button>
    </div>
    <button class="icon-btn icon-btn--x" data-ui="sign-skip" type="button" data-i18n-aria="BB_NO_THANKS"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  </section>

  <!-- Победа (bb9, UX-07): заголовок, награда, компактное открытие оружия, «Впереди: …», «×2» с суммой, «Дальше ▶». -->
  <section class="screen screen--modal screen--result" data-screen="win">
    <button class="icon-btn icon-btn--tl icon-btn--svg" data-ui="win-share" type="button" data-i18n-aria="BB_A_SHARE"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 12.5V19a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6.5"/></svg></button>
    <button class="icon-btn icon-btn--tr" data-ui="win-brush" type="button" data-i18n-aria="BB_COLOR_TITLE"><img data-icon="brush" alt=""></button>
    <div class="banner banner--win"><div class="banner__title" data-i18n="BB_WIN_TITLE"></div></div>
    <div class="result">
      <div class="result__info">
        <div class="reward"><span data-ui="win-reward"></span><img class="coin-ico" data-icon="coin" alt=""></div>
        <div class="unlock" data-ui="win-weapon" hidden>
          <div class="unlock__pic"><img class="weapon__img" data-ui="win-weapon-img" alt=""></div>
          <div class="unlock__body">
            <div class="unlock__title" data-ui="win-weapon-title"></div>
            <div class="segs" data-ui="win-weapon-segs"></div>
            <div class="unlock__sub" data-ui="win-weapon-sub" data-i18n="BB_WEAPON_NEXT_RUN" hidden></div>
          </div>
        </div>
        <!-- Тизер следующего уровня: «Впереди: [рисунок] подпись»; нет тизера — скрыт (hidden). -->
        <div class="teaser" data-ui="win-teaser" hidden>
          <span class="teaser__next" data-i18n="BB_AHEAD"></span>
          <div class="teaser__pic" data-ui="win-teaser-pic"><img data-ui="win-teaser-img" alt=""><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#ti-mul"/></svg></div>
          <span class="teaser__text" data-ui="win-teaser-text"></span>
        </div>
      </div>
      <div class="result__actions">
        <button class="btn btn--ad btn--late" data-ui="win-double" type="button"><img data-icon="ad" alt=""><b class="btn__x" data-i18n="WIN_DOUBLE"></b><span class="btn__sum"><b data-ui="win-double-sum"></b><img class="coin-ico" data-icon="coin" alt=""></span></button>
        <button class="btn btn--play btn--main btn--late" data-ui="win-next" type="button"><span data-i18n="WIN_NEXT"></span><img data-icon="play" alt=""></button>
      </div>
    </div>
  </section>

  <!-- Поражение (bb9, UX-07): причина крупно, сколько пройдено, «↻ Ещё раз» — сразу заново тот же уровень. -->
  <section class="screen screen--modal screen--result" data-screen="lose">
    <div class="banner banner--lose">
      <div class="banner__title banner__title--danger" data-ui="lose-cause-text"></div>
    </div>
    <div class="result">
      <div class="result__info">
        <div class="cause" data-ui="lose-cause">
          <div class="cause__pic"><img data-ui="lose-cause-img" alt=""><svg viewBox="0 0 64 64" aria-hidden="true"><use href="#lc-breach"/></svg></div>
        </div>
        <div class="lose-progress">
          <div class="lose-progress__pct" data-ui="lose-pct"></div>
          <div class="meter"><i data-ui="lose-bar"></i></div>
        </div>
      </div>
      <div class="result__actions">
        <button class="btn btn--play btn--main" data-ui="lose-restart" type="button"><img data-icon="restart" alt=""><span data-i18n="LOSE_TITLE"></span></button>
      </div>
    </div>
  </section>

  <!-- Пауза: продолжить / звук / в меню / как играть — значки. -->
  <section class="screen screen--modal" data-screen="pause">
    <div class="card card--row">
      <button class="round round--play" data-ui="pause-resume" type="button" data-i18n-aria="BB_CONTINUE"><img data-icon="play" alt=""></button>
      <button class="round round--blue" data-ui="pause-sound" type="button" data-i18n-aria="BB_A_SOUND"><img data-icon="sound_on" alt=""></button>
      <button class="round round--blue round--svg" data-ui="pause-restart" type="button" data-i18n-aria="BB_EXIT_Q"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5L12 4l8.5 7.5M6 10v9.5h4.5v-5h3v5H18V10"/></svg></button>
      <button class="round round--blue round--svg" data-ui="pause-help" type="button" data-i18n-aria="BB_HELP_TITLE"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.6 8.8a3.5 3.5 0 1 1 5.2 3.1c-1.2.7-1.8 1.4-1.8 2.8v.6"/><circle cx="12" cy="19" r="1.3"/></svg></button>
    </div>
  </section>

  <!-- Выход из забега (домик в паузе, UX-06): попытка сгорит — спрашиваем. «Продолжить» — назад в паузу. -->
  <section class="screen screen--modal" data-screen="exit">
    <div class="card card--confirm">
      <div class="card__title" data-i18n="BB_EXIT_Q"></div>
      <div class="card__text" data-i18n="BB_EXIT_NOTE"></div>
      <div class="card__actions">
        <button class="btn btn--blue" data-ui="exit-no" type="button" data-i18n="BB_CONTINUE"></button>
        <button class="btn btn--danger" data-ui="exit-yes" type="button" data-i18n="BB_EXIT"></button>
      </div>
    </div>
  </section>

  <!-- Цвет отряда (bb9, UX-04): тап по образцу — примерка на отряде; закрытый открывается явной кнопкой (монеты или ролик). -->
  <section class="screen screen--modal" data-screen="colors" data-ui="colors">
    <div class="card card--colors">
      <div class="card__head"><div class="card__title" data-i18n="BB_COLOR_TITLE"></div>
        <button class="icon-btn icon-btn--x" data-ui="colors-close" type="button" data-i18n-aria="BB_CLOSE"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button></div>
      <div class="swatches">
        <button class="swatch" data-ui="color-0" type="button"></button>
        <button class="swatch" data-ui="color-1" type="button"></button>
        <button class="swatch" data-ui="color-2" type="button"></button>
        <button class="swatch" data-ui="color-3" type="button"></button>
      </div>
      <div class="card__text" data-i18n="BB_COLOR_NOTE"></div>
      <div class="card__actions colors__buy" data-ui="colors-buy" hidden>
        <button class="btn btn--coin" data-ui="color-buy-coins" type="button"><img class="coin-ico" data-icon="coin" alt=""><b data-ui="color-cost"></b></button>
        <button class="btn btn--ad" data-ui="color-buy-ad" type="button"><img data-icon="ad" alt=""><span data-i18n="BB_UNLOCK"></span></button>
      </div>
    </div>
  </section>

  <!-- Как играть (bb9, UX-01): три мини-сцены из игровых значков, «Понятно» внизу вне прокрутки; поддержка — отдельным окном. -->
  <section class="screen screen--modal" data-screen="info">
