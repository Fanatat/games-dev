<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Police Runner — three.js proto</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8fd3e8; touch-action: none;
    -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fps { position: fixed; left: 6px; top: 6px; font: 12px/1.2 monospace; color: #fff;
    background: rgba(0,0,0,.45); padding: 2px 5px; border-radius: 4px; pointer-events: none; z-index: 3; }
  #ov { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding-bottom: 22vh; background: rgba(15,24,48,.35); z-index: 2; }
  #ov.hide { display: none; }
  #msg { color: #fff; font-size: 18px; margin-bottom: 18px; text-shadow: 0 1px 3px #000; }
  #play { font-size: 30px; font-weight: 800; color: #fff; background: #2f6bff; border: 0;
    border-radius: 18px; padding: 18px 64px; box-shadow: 0 6px 0 #1b3fa0; opacity: .4; }
  #play.on { opacity: 1; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="fps">--</div>
<div id="ov"><div id="msg">Загрузка…</div><button id="play" disabled>Играть</button></div>
<script type="module" src="./main.js"></script>
</body>
</html>
