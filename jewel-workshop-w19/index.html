<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2a190e">
  <title>Мастерская украшений</title>
  <meta name="ws-build" content="w19-a76d6e3-20261010">
  <!-- Форк game3 «Мастерская украшений». Отдельная точка входа:
       main.js/board.js/style.css/платформенные адаптеры game3 НЕ подключены —
       ни рекламы, ни энергии, ни магазина, ни сейвов исходной игры.
       Поле — workshop_board.js, изделия — workshop_jewelry.js, правила —
       workshop_rules.js, звуки — workshop_sfx.js через sound.js game3. -->
  <link rel="preload" href="workshop_assets/gems.webp?v=19" as="image" type="image/webp">
  <link rel="stylesheet" href="workshop.css?v=19">
</head>
<body>

  <!-- Меню: витрина коллекций -->
  <div id="screen-menu" class="screen active">
    <div class="ws-menu">
      <div class="ws-menu-top">
        <button id="ws-menu-coins" class="ws-coins" type="button" aria-label="Монеты"><span class="ws-coin-ico" aria-hidden="true"></span><span id="ws-menu-coins-n">0</span></button>
        <button id="btn-sound" class="ws-knob" aria-label="Звук" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
      </div>
      <h1 class="ws-title">Мастерская<br>украшений</h1>
      <p class="ws-sub">Перекладывайте камни по пробиркам. Четыре одинаковых — заказчик заберёт их сам, а камень встанет в украшение.</p>
      <button id="btn-play" class="ws-btn ws-btn-primary ws-btn-hero">Играть</button>
      <div class="ws-play-note" id="ws-play-note"></div>
      <section class="ws-showcase" id="ws-showcase" aria-label="Витрина изделий"></section>
      <section class="ws-decor" id="ws-decor" aria-label="Убранство мастерской"></section>
      <div class="ws-menu-foot">
        <span class="ws-proto">Тестовая сборка · 30 уровней</span>
      </div>
    </div>
  </div>

  <!-- Игра -->
  <div id="screen-workshop" class="screen">
    <div class="ws-root">
      <header class="ws-header">
        <button id="btn-back" class="ws-knob" aria-label="На витрину"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H6m5-6-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="ws-head-mid">
          <div id="ws-level-title" class="ws-level-title"></div>
          <div id="ws-level-name" class="ws-level-name"></div>
        </div>
        <button id="ws-coins" class="ws-coins" type="button" aria-label="Монеты"><span class="ws-coin-ico" aria-hidden="true"></span><span id="ws-coins-n">0</span></button>
        <button id="btn-sound-game" class="ws-knob" aria-label="Звук" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="17.5" r="2.6" fill="currentColor"/><circle cx="16.5" cy="15.5" r="2.6" fill="currentColor"/></svg></button>
      </header>

      <section class="ws-orders-panel" aria-label="Заказы">
        <div class="ws-status">
          <canvas id="ws-piece" class="ws-piece" aria-label="Изделие: камни встают в гнёзда по мере выдачи заказов"></canvas>
          <div class="ws-stat">
            <span class="ws-counter" id="ws-counter" aria-live="polite"></span>
            <span class="ws-moves" id="ws-moves"></span>
            <span class="ws-stars" id="ws-stars"><i>★</i><i>★</i><i>★</i><em id="ws-star-next"></em></span>
          </div>
        </div>
        <div class="ws-orders" id="ws-orders"></div>
        <div class="ws-queue" id="ws-queue"><span class="ws-queue-label">Далее:</span><span class="ws-queue-items" id="ws-queue-items"></span></div>
      </section>

      <div class="ws-caption" id="ws-caption" aria-live="polite"></div>
      <div class="ws-rescue hidden" id="ws-rescue" role="alert">
        <span id="ws-rescue-text"></span>
        <button id="btn-rescue" class="ws-btn ws-btn-primary ws-btn-small"></button>
      </div>

      <main id="board-wrap" class="ws-board-wrap">
        <canvas id="board-canvas" aria-label="Пробирки с камнями"></canvas>
      </main>

      <footer class="ws-actions">
        <div class="ws-action">
          <button id="btn-undo" class="ws-knob ws-knob-lg" aria-label="Отменить ход"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button>
          <span>Отменить</span>
        </div>
        <div class="ws-action">
          <button id="btn-hint" class="ws-tile" aria-label="Подсказка">?</button>
          <span id="ws-hint-label">Подсказка</span>
        </div>
        <div class="ws-action">
          <button id="btn-restart" class="ws-knob ws-knob-lg" aria-label="Начать заново"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12a7 7 0 1 1-2.05-4.95" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M19.5 3.5v5h-5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          <span>Заново</span>
        </div>
      </footer>
    </div>

    <!-- Победа: показывается ровно один раз за прохождение уровня -->
    <div id="win-overlay" class="ws-win hidden">
      <div class="ws-win-box">
        <div class="ws-win-kicker" id="ws-win-kicker"></div>
        <div class="ws-win-title" id="ws-win-title">Готово!</div>
        <canvas id="ws-win-jewel" class="ws-win-jewel" aria-hidden="true"></canvas>
        <div class="ws-win-name" id="ws-win-name"></div>
        <div class="ws-win-stars" id="ws-win-stars" aria-hidden="true"><i>★</i><i>★</i><i>★</i></div>
        <div class="ws-win-pay"><span class="ws-coin-ico" aria-hidden="true"></span><span id="ws-win-coins">+0</span></div>
        <div class="ws-win-text" id="ws-win-text"></div>
        <div class="ws-win-tip" id="ws-win-tip"></div>
        <div class="ws-coll">
          <div class="ws-coll-dots" id="ws-coll-dots" aria-hidden="true"></div>
          <div class="ws-coll-text" id="ws-coll-text"></div>
        </div>
        <button id="btn-next" class="ws-btn ws-btn-primary">Дальше</button>
        <div class="ws-win-row">
          <button id="btn-again" class="ws-btn ws-btn-secondary">Ещё раз</button>
          <button id="btn-win-menu" class="ws-btn ws-btn-secondary">Витрина</button>
        </div>
      </div>
    </div>

    <!-- «Сложный заказ»: ходы кончились -->
    <div id="lose-overlay" class="ws-win ws-lose hidden" role="alertdialog" aria-labelledby="ws-lose-title">
      <div class="ws-win-box">
        <div class="ws-win-kicker">Сложный заказ</div>
        <div class="ws-win-title" id="ws-lose-title">Ходы кончились</div>
        <div class="ws-win-text" id="ws-lose-text"></div>
        <button id="btn-more" class="ws-btn ws-btn-primary">+5 ходов · 50</button>
        <div class="ws-lose-coins" id="ws-lose-coins"></div>
        <div class="ws-win-row">
          <button id="btn-lose-undo" class="ws-btn ws-btn-secondary">Отменить ход</button>
          <button id="btn-lose-again" class="ws-btn ws-btn-secondary">Заново</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Слои поверх обоих экранов -->
  <canvas id="fx-canvas" class="ws-fx-top" aria-hidden="true"></canvas>
  <div id="hint-toast" class="ws-toast hidden" role="status"></div>
  <div id="modal-overlay" class="ws-win ws-modal hidden" role="dialog" aria-modal="true" aria-labelledby="ws-modal-title">
    <div class="ws-win-box">
      <div class="ws-win-kicker" id="ws-modal-kicker"></div>
      <canvas id="ws-modal-art" class="ws-modal-art" aria-hidden="true"></canvas>
      <div class="ws-win-title" id="ws-modal-title"></div>
      <div class="ws-win-text" id="ws-modal-text"></div>
      <button id="btn-modal-ok" class="ws-btn ws-btn-primary">Понятно</button>
    </div>
  </div>
  <canvas id="confetti-canvas" class="ws-confetti" aria-hidden="true"></canvas>

  <script src="workshop_sfx.js?v=19"></script>
  <script src="sound.js?v=19"></script>
  <script src="confetti.js?v=19"></script>
  <script src="workshop_rules.js?v=19"></script>
  <script src="workshop_levels.js?v=19"></script>
  <script src="workshop_board.js?v=19"></script>
  <script src="workshop_jewelry.js?v=19"></script>
  <script src="workshop.js?v=19"></script>
</body>
</html>
